  <style id="splash-screen-style">
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      min-height: 100vh;
      background-color: #160B24;
      background-image: radial-gradient(ellipse at 50% 42%, #51206f 0%, #28103c 42%, #160B24 82%);
      background-size: cover;
      font-family: Arial, sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
    }

    .splash-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transform: translateY(-12px);
      animation: arrive 650ms cubic-bezier(.2,.8,.2,1) both;
    }

    .splash-mark {
      display: grid;
      width: 76px;
      height: 76px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
      box-shadow: 0 18px 50px rgba(8,2,18,.28), inset 0 1px rgba(255,255,255,.2);
    }

    .splash-mark svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: #fff;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .splash-title {
      margin-top: 6px;
      font-family: Georgia, serif;
      font-size: 34px;
      letter-spacing: -.5px;
    }

    .splash-caption {
      color: rgba(255,255,255,.72);
      font-size: 13px;
      letter-spacing: .5px;
    }

    .splash-loader {
      width: 136px;
      height: 2px;
      margin-top: 28px;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(255,255,255,.13);
    }

    .splash-loader span {
      display: block;
      width: 62%;
      height: 100%;
      border-radius: inherit;
      background: #E83BA7;
      animation: loading 1.7s ease-in-out infinite alternate;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(-12px); }
    }

    @keyframes loading {
      from { transform: translateX(-25%); opacity: .72; }
      to { transform: translateX(70%); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading TailorHub">
    <div class="splash-brand">
      <div class="splash-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <circle cx="8" cy="23" r="4"></circle>
          <circle cx="24" cy="23" r="4"></circle>
          <path d="M11 20 24 6M21 20 8 6M14 16l4 4"></path>
        </svg>
      </div>
      <div class="splash-title">TailorHub</div>
      <div class="splash-caption">THE ATELIER WORKBOOK</div>
      <div class="splash-loader" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
